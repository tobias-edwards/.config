#######################################################################
# HELP
#######################################################################
# 'Prefix ?' - list tmux shortcuts
# 'Prefix :new <enter>' - create new session
# 'Prefix {' or 'Prefix }' to shift panes left or right, respectively

# Key  bindings
# By default, bound  to the _prefix_ key table
# i.e. 'bind h' - Prefix + h
# Options:
# - '-r' - key can repeat
# - '-T' - add to root table, so prefix not required 


#######################################################################
# PREFIX
#######################################################################
unbind C-b
set -g prefix C-space
bind C-space send-prefix


#######################################################################
# GENERAL
#######################################################################
# Reload configuration file
bind R source-file ~/.config/tmux/tmux.conf \; display "Reloaded ~/.config/tmux/tmux.conf"

# Delay between prefix and command
set -s escape-time 0 

# Enable mouse mode, required for tmux-better-mouse-mode plugin
set -g mouse on

# Allow chaining commands without prefix when pressed within time (ms)
set -g repeat-time 500

# Don't cycle search
setw -g wrap-search off


#######################################################################
# APPEARENCE
#######################################################################
GREY_0='#7c6f64'
GREY_1='#3a3735'
GREY_2='#a89984'
GREY_3='#32302f'

# Requires lots of fiddling, see below resources
# https://gist.github.com/andersevenrud/015e61af2fd264371032763d4ed965b6
# https://gist.github.com/joshuarli/247018f8617e6715e1e0b5fd2d39bb6c
# https://github.com/alacritty/alacritty/issues/109
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"


#######################################################################
# PANES
#######################################################################
set -g pane-active-border-style "fg=$GREY_2"
set -g pane-border-style "fg=#5a524c" # :hi VertSplit
setw -g pane-border-format ""
setw -g pane-border-lines double
setw -g pane-border-status bottom 

# Navigate
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize
bind -r M-h resize-pane -L 5
bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5
bind -r M-l resize-pane -R 5

# Split
bind v split-window -h -c "#{pane_current_path}"
unbind %
unbind s
bind s split-window -v -c "#{pane_current_path}"
unbind \"

# Kill panes without confirmation
bind-key x kill-pane


#######################################################################
# SESSIONS
#######################################################################
# List
unbind p
bind p choose-tree -Zs

unbind L


#######################################################################
# STATUS BAR
#######################################################################
set -g status "on"
set -g status-justify "left"
set -g status-left " #S | "
set -g status-left-length "100"
set -g status-left-style "none"
set -g status-right ""
set -g status-style "none,bg=$GREY_3"

setw -g window-status-activity-style "underscore,fg=$GREY_2,bg=$GREY_1"
setw -g window-status-current-format "#[fg=$GREY_1,bg=$GREY_2] #W "
setw -g window-status-format "#[fg=$GREY_2,bg=$GREY_1] #W "
setw -g window-status-separator ""

# Message
set -g message-command-style "fg=$GREY_2,bg=default"
set -g message-style "fg=$GREY_2,bg=default"


#######################################################################
# VI
#######################################################################
setw -g mode-keys vi

# Begin and cancel visual selection
bind -T copy-mode-vi v \
  if -F '#{selection_present}' \
    { send -X clear-selection } \
    { send -X begin-selection }

bind -T copy-mode-vi C-c send -X clear-selection
unbind -T copy-mode-vi space

bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
unbind -T copy-mode-vi enter
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"

# Search up with '/'
bind / copy-mode \; send-key ?


#######################################################################
# WINDOWS
#######################################################################
# Navigate
bind N prev

# Swap windows
unbind <
unbind >
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# Rename windows automatically
set -g status-interval 5
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

#######################################################################
# PLUGINS
#######################################################################
# prefix I - install plugins
# prefix U - update plugins
# prefix alt u - uninstall plugins

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'nhdaly/tmux-better-mouse-mode'
  # Scrolling in buffer programs is passed as <Up>/<Down>
  set -g @emulate-scroll-for-no-mouse-alternate-buffer "on"
  # Scrolling a pane will not shift mouse focus
  set -g @scroll-without-changing-pane "on"
  # Scroll one line per mouse wheel scroll click
  set -g @scroll-speed-num-lines-per-scroll "1"

set -g @plugin 'tmux-plugins/tmux-open'
  # Open highlighted selection with default program
  set -g @open 'o'
  # Google search visually selected snippet with Shift-s
  set -g @open-S 'https://www.google.com/search?q='

# Pass Tmux yanks through to the system clipboard
set -g @plugin 'tmux-plugins/tmux-yank'
  set -g @yank_action 'copy-pipe-no-clear'

# Persist tmux sessions
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Replace with native predefined searches
# set -g @plugin 'tmux-plugins/tmux-copycat'

TPM_LOCATION='~/.config/tmux/plugins/tpm'
if "test ! -d $TPM_LOCATION" {
  run "git clone https://github.com/tmux-plugins/tpm $TPM_LOCATION"
}

# Initialize tpm (keep this line at the very bottom of tmux.conf)
set-environment -g PATH "/opt/homebrew/bin:/usr/local/bin:/bin:/usr/bin" # See https://github.com/tmux-plugins/tpm/issues/203#issuecomment-858036483
run '#{TPM_LOCATION}/tpm'
