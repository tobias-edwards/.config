[general]
live_config_reload = true

[colors]
# If `true`, bold text is drawn using the bright color variants.
draw_bold_text_with_bright_colors = true

# https://gist.github.com/sainnhe/ad5cbc4f05c4ced83f80e54d9a75d22f
[colors.bright]
black = "0x3c3836"
blue = "0x7daea3"
cyan = "0x89b482"
green = "0xa9b665"
magenta = "0xd3869b"
red = "0xea6962"
white = "0xd4be98"
yellow = "0xd8a657"

[colors.normal]
black = "0x3c3836"
blue = "0x7daea3"
cyan = "0x89b482"
green = "0xa9b665"
magenta = "0xd3869b"
red = "0xea6962"
white = "0xd4be98"
yellow = "0xd8a657"

[colors.primary]
background = "0x282828"
foreground = "0xd4be98"

[cursor]
vi_mode_style.shape = "Block"

# macOS:
# alacritty-direct
# Linux:
# xterm-256color
[env]
TERM = "alacritty-direct"

[font]
size = 14.0

# Get patched (with icons) Nerd Fonts from https://www.nerdfonts.com/
[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[[keyboard.bindings]]
action = "ToggleViMode"
key = "A"
mode = "~Search"
mods = "Control"

[[keyboard.bindings]]
action = "ScrollToBottom"
key = "A"
mode = "Vi|~Search"
mods = "Control"

[scrolling]
# Maximum number of lines in the scrollback buffer.
# Specifying '0' will disable scrolling.
history = 10000
# Number of lines the viewport will move for every line scrolled when
# scrollback is enabled (history > 0).
multiplier = 1

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>"

[terminal.shell]
# Autostart tmux
# NOTE: Cannot launch from spotlight without exact tmux path, see https://github.com/alacritty/alacritty/issues/5419#issuecomment-1024193680
args = ["--login", "-c", "/opt/homebrew/bin/tmux attach || /opt/homebrew/bin/tmux new-session -s main"]
program = "/bin/zsh"

[window]
decorations = "none" # Hide title bar
opacity = 1.0
option_as_alt = "Both"
padding.x = 2
padding.y = 2
